<div class="panel">

    <h3>
        Active Events
    </h3>


    {% if events %}

        {% for event in events %}

        <div class="event-item">

            <strong>
                {{ event.title }}
            </strong>


            <p>
                {{ event.message }}
            </p>


            <small>

                Severity:
                {{ event.severity }}

                |

                Category:
                {{ event.category }}

                |

                Occurrences:
                {{ event.occurrences }}

            </small>


        </div>

        {% endfor %}


    {% else %}

        <p>
            No active events
        </p>

    {% endif %}


</div>
