<section class="panel">

    <h2>
        <i class="fas fa-server"></i>
        Proxmox Guests
    </h2>


    <div class="container-grid">


        {% for guest in infra.proxmox.guests %}


        <div class="container-card">


            <div class="container-header">


                {% if guest.status == "running" %}

                    <span class="status running">
                        ●
                    </span>

                {% else %}

                    <span class="status stopped">
                        ●
                    </span>

                {% endif %}


                <strong>
                    {{ guest.name }}
                </strong>


            </div>



            <div class="container-info">


                <div>
                    Type:
                    {{ guest.type }}
                </div>


                <div>
                    Status:
                    {{ guest.status }}
                </div>


                <div>
                    CPU:
                    {{ guest.cpu }}
                </div>


                <div>
                    Memory:
                    {{ guest.memory }}
                </div>


            </div>


        </div>


        {% endfor %}


    </div>


</section>
